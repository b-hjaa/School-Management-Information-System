<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learners Registration Form</title>
    
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <div class="container">
        <h2>Learners Registration Form</h2>
        
        <form action="processLearners.php" method="POST" onsubmit="return validateRegistrationForm()">
            <label>Admission Number:</label>
            <input type="text" name="admission_number" required>

            <label>First Name:</label>
            <input type="text" name="first_name" required>

            <label>Surname:</label>
            <input type="text" name="last_name" required>

            <label>Date of Birth:</label>
            <input type="date" name="date_of_birth">

            <label>Gender:</label>
            <select name="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>

            <label>Grade:</label>
            <input type="number" name="grade" min="1" max="12" required>

            <label>Email Address:</label>
            <input type="email" name="email">

            <button type="submit" name="register">Register</button>
        </form>
    </div>
</body>
</html>
